# mousemaster will automatically convert the key aliases to your current keyboard layout.
# However, if you want to make a change to the key aliases, and your keyboard layout
# is not us-qwerty, then remove .us-qwerty
# Hide the console window
hide-console=true

# Logging
logging.level=WARN
logging.key-redaction=anonymize
logging.to-file=true
logging.file-path=mousemaster.log

forced-active-keyboard-layout=sv-qwerty
key-alias.enablebasekey=backspace
key-alias.exit=q p esc
key-alias.clickthendisable=.
key-alias.up=k uparrow
key-alias.down=j downarrow
key-alias.left=h leftarrow
key-alias.right=l rightarrow
key-alias.edge=leftctrl
key-alias.wheelup=,
key-alias.wheeldown=m
key-alias.wheelleft=u
key-alias.wheelright=o
key-alias.leftbutton=ö menu
key-alias.rightbutton=ä
key-alias.middlebutton=rightshift
key-alias.toggleleft=n
key-alias.fast=v
key-alias.slow=leftshift
key-alias.superslow=backspace
key-alias.grid=g
key-alias.hint=f
key-alias.screenselection=c
key-alias.navigateback=t
key-alias.navigateforward=y
key-alias.recursivehint=r
# The 3x3 block under the right hand: each key picks the matching ninth of the grid.
key-alias.recursivehintkey=u i o j k l m , .
key-alias.hint1key=q w e r t a s d f g z x c v b y u i o p h j k l ö n m , . -
key-alias.hint2key=q w e r u i o p a s d f j k l ö z x c v m , . -
# key-alias.extendedhint1key=f d s a g h j k l ö z x c v b n m , . - q w e r t y u i o p
key-alias.extendedhint1key=f j d k s l a ö u r e i w o c q p v g n h t y b m x , z . -
# key-alias.extendedhint1key=q w e r t y u i o p å a s d f g h j k l ö ä z x c v b n m , . -
# key-alias.extendedhint1key=1 2 7 8 3 4 9 0 q w u i e r o p a s j k d f l ö z x m , c v . -
# key-alias.extendedhint1key=1 2 3 4 7 8 9 0 q w e r u i o p a s d f j k l ö z x c v m , . -
# key-alias.extendedhint1key=q w e r u i o p a s d f j k l ö z x c v m , . -

key-alias.extendedhint2key=1 2 3 4 5 6 7 8 9 0 q w e r t y u i o p a s d f g h j k l ö z x c v b n m , . -
key-alias.hintscreenselectionkey=j k l ö a s d f g

# The large screens share one hint layout. Cell sizes still differ per resolution.
screen-alias.largescreen=3840x2160 2560x1440 3440x1440

idle-mode.push-mode-to-history-stack=true
normal-mode.push-mode-to-history-stack=true

# Press backspace while holding leftalt to activate.
# Hold leftshift as well to go straight to hint mode, or leftctrl to go straight to UI hints.
idle-mode.to.normal-mode=^{leftshift leftctrl} +leftalt-0 +enablebasekey
idle-mode.to.hint1-mode=_{leftshift leftalt} ^{leftctrl} +enablebasekey
idle-mode.to.ui-hint-mode=_{leftctrl leftalt} ^{leftshift} +enablebasekey

# Every mode that extends _indicator-mode shows this indicator.
_indicator-mode.indicator.enabled=true
_indicator-mode.indicator.color=#FF0000 | _{iswheeling} -> #FFFF00 | _{ismousepressing} -> #00FF00
normal-mode=_indicator-mode
# The following keys can be used to go back to idle mode:
# exit keys (q or p), click-then-disable key (.), leftalt + e, leftalt + capslock,
# leftctrl + f, leftctrl + l, leftctrl + e, f2, f3,  /.
normal-mode.to.idle-mode=+exit | -clickthendisable | +leftalt-0 +enablebasekey \
  | _{leftctrl} #f | _{leftctrl} #l | _{leftctrl} #e | #f2 | #f3 | #/
normal-mode.mouse.initial-velocity=0
# Hold slow (leftshift), fast (v) or superslow (backspace) to change speed.
normal-mode.mouse.max-velocity=2200 | _{slow} ^{superslow} -> 350 | _{fast} -> 4500 | _{superslow} -> 75
normal-mode.mouse.acceleration=800 | _{fast} -> 3000
normal-mode.wheel.initial-velocity=1500
normal-mode.wheel.max-velocity=2000 | _{slow} ^{superslow} -> 200 | _{fast} -> 10000 | _{superslow} -> 50
normal-mode.wheel.acceleration=500 | _{fast} -> 10000
# Start moving with direction keys.
# When releasing the edge key, if direction keys are already pressed then start moving.
normal-mode.start-move.up=+up | _{up} -edge
normal-mode.start-move.down=+down | _{down} -edge
normal-mode.start-move.left=+left | _{left} -edge
normal-mode.start-move.right=+right | _{right} -edge
# Stop moving by releasing direction keys.
# If the edge/grid/hint/screenselection key is pressed, then stop moving.
normal-mode.stop-move.up=-up | #edge | +grid | +hint | +recursivehint | +screenselection
normal-mode.stop-move.down=-down | #edge | +grid | +hint | +recursivehint | +screenselection
normal-mode.stop-move.left=-left | #edge | +grid | +hint | +recursivehint | +screenselection
normal-mode.stop-move.right=-right | #edge | +grid | +hint | +recursivehint | +screenselection
# Register leftctrl to allow ctrl-clicking.
normal-mode.press.left=_{none | leftctrl} +leftbutton | _{none | leftctrl} +clickthendisable
normal-mode.press.middle=+middlebutton
normal-mode.press.right=_{none | leftctrl} +rightbutton
normal-mode.release.left=-leftbutton
normal-mode.release.middle=-middlebutton
normal-mode.release.right=-rightbutton
normal-mode.toggle.left=_{none | leftctrl} +toggleleft
normal-mode.start-wheel.up=+wheelup
normal-mode.start-wheel.down=+wheeldown
normal-mode.start-wheel.left=+wheelleft
normal-mode.start-wheel.right=+wheelright
normal-mode.stop-wheel.up=-wheelup
normal-mode.stop-wheel.down=-wheeldown
normal-mode.stop-wheel.left=-wheelleft
normal-mode.stop-wheel.right=-wheelright

# Keep the speed keys from reaching apps.
normal-mode.noop.eatspeedmods=+slow | +fast | +superslow

# Snap to screen edges.
normal-mode.to.edge-mode=#edge
edge-mode.noop.eatspeedmods=+slow | +fast | +superslow
edge-mode.to.normal-mode=-edge
edge-mode=_indicator-mode
edge-mode.mouse=normal-mode.mouse
edge-mode.press=normal-mode.press
edge-mode.release=normal-mode.release
edge-mode.toggle=normal-mode.toggle
# Invisible grid used for snapping/attaching to the screen's edges.
edge-mode.grid.area=active-screen
edge-mode.grid.area-width-percent=0.80
edge-mode.grid.area-height-percent=0.95
edge-mode.grid.row-count=1
edge-mode.grid.column-count=1
# Change line-visible to true to see the edge lines.
edge-mode.grid.line-visible=false
edge-mode.snap.up=+up | _{up} +edge
edge-mode.snap.down=+down | _{down} +edge
edge-mode.snap.left=+left | _{left} +edge
edge-mode.snap.right=+right | _{right} +edge

# Grid is enabled with g, disabled with g or esc.
# Press direction keys to shrink the grid in one direction.
normal-mode.to.grid-mode=^{slow} +grid
grid-mode.to.normal-mode=+grid | +esc
grid-mode.to.idle-mode=+exit
grid-mode=_indicator-mode
grid-mode.grid.area=active-screen
grid-mode.grid.area-width-percent=0.99
grid-mode.grid.area-height-percent=0.99
grid-mode.grid.synchronization=mouse-follows-grid-center
grid-mode.grid.line-visible=true
grid-mode.grid.line-color=#FF0000
grid-mode.shrink-grid.up=+up
grid-mode.shrink-grid.down=+down
grid-mode.shrink-grid.left=+left
grid-mode.shrink-grid.right=+right

# Window mode is enabled by holding the slow key (leftshift) and pressing the grid key (g).
# It is exited as soon as the slow key (leftshift) is released.
# Move to the active window's edges with direction keys.
# Move to the active window's center with the grid key (g).
normal-mode.to.window-mode=_{slow} +grid
window-mode.to.normal-mode=-slow
window-mode=_indicator-mode
window-mode.grid.area=active-window
# Top inset to be able to quickly access a window's title bar (and potentially grab it and move the window).
window-mode.grid.area-top-inset=15
window-mode.grid.synchronization=mouse-follows-grid-center
window-mode.grid.row-count=1
window-mode.grid.column-count=1
window-mode.grid.line-visible=true
window-mode.grid.line-color=#FF0000
window-mode.snap.up=+up
window-mode.snap.down=+down
window-mode.snap.left=+left
window-mode.snap.right=+right
window-mode.move-to-grid-center=+grid

# Hints are enabled with f, disabled with f or esc.
# Holding leftshift while selecting the hint will trigger a second hint pass with a smaller hint grid
# centered around the mouse to refine the position.
normal-mode.to.hint1-mode=^{leftalt slow} +hint
# Go back to normal-mode when esc, backspace, or the last letter of the hint is pressed.
hint1-mode.to.normal-mode=+esc | +backspace | ^{slow} +extendedhint1key
# Force switch to normal-mode when hint is selected, even if other keys
# like leftctrl or leftalt are pressed.
hint1-mode.timeout.duration-millis=0
hint1-mode.timeout.only-if-idle=false
hint1-mode.timeout.mode=normal-mode
hint1-mode.break-combo-preparation=+extendedhint1key
hint1-mode.hide-cursor.enabled=true
hint1-mode.hint.type=grid
hint1-mode.hint.grid-area=active-screen
hint1-mode.hint.active-screen-grid-area-center=screen-center
hint1-mode.hint.grid-cell-width=74 | _{3840x2160} -> 96 | _{2560x1440 | 3440x1440} -> 64
hint1-mode.hint.grid-cell-height=36 | _{3840x2160} -> 54 | _{3440x1440} -> 32
hint1-mode.hint.layout-row-count=6 | _{largescreen} -> 4
hint1-mode.hint.layout-column-count=5 | _{largescreen} -> 10
hint1-mode.hint.selection-keys=hint1key | _{largescreen} -> extendedhint1key
hint1-mode.hint.select=_{none | slow} +extendedhint1key
hint1-mode.hint.font-name=Jetbrains Mono
hint1-mode.hint.font-size=13
hint1-mode.hint.font-spacing-percent=0.6
hint1-mode.hint.prefix-box-enabled=true
hint1-mode.hint.prefix-in-background=true
hint1-mode.hint.prefix-font-name=Segoe UI Light
hint1-mode.hint.prefix-font-size=120
hint1-mode.hint.prefix-font-color=#FFD93D
hint1-mode.hint.prefix-font-opacity=0.8
hint1-mode.hint.prefix-font-shadow-opacity=0
hint1-mode.hint.selected-font-opacity=0.5
# Boxes turn green while leftshift is held: the last letter then opens the second hint grid.
hint1-mode.hint.box-color=#000000 | _{slow} -> #004400
hint1-mode.hint.undo=backspace

# Switch to hint2-mode (showing the second hint grid) when the last letter of the hint
# is pressed while holding the slow key (leftshift).
hint1-mode.to.hint2-mode=_{slow} +extendedhint1key
hint2-mode.timeout=hint1-mode.timeout
hint2-mode.hide-cursor=hint1-mode.hide-cursor
hint2-mode.to.idle-mode=+exit
hint2-mode.to.hint1-mode=_{none | slow} +backspace
hint2-mode.to.normal-mode=+esc | _{none | slow} +extendedhint1key
hint2-mode.break-combo-preparation=_{none | slow} +extendedhint1key
hint2-mode.hint=hint1-mode.hint
hint2-mode.hint.type=grid
hint2-mode.hint.box-color=#000000
hint2-mode.hint.grid-area=active-screen
hint2-mode.hint.active-screen-grid-area-center=last-selected-hint
hint2-mode.hint.grid-max-row-count=3 | _{largescreen} -> 4
hint2-mode.hint.grid-max-column-count=8 | _{largescreen} -> 10
hint2-mode.hint.grid-cell-width=50 | _{3840x2160} -> 48 | _{2560x1440} -> 32 | _{3440x1440} -> 43
hint2-mode.hint.grid-cell-height=75 | _{3840x2160} -> 67.5 | _{2560x1440 | 3440x1440} -> 45
hint2-mode.hint.selection-keys=hint2key | _{largescreen} -> extendedhint2key
hint2-mode.hint.select=+extendedhint2key
hint2-mode.hint.prefix-in-background=false
hint2-mode.hint.prefix-box-enabled=false
hint2-mode.zoom.percent=5.0
hint2-mode.zoom.center=last-selected-hint

# Screen selection is enabled with c, disabled with c or esc.
normal-mode.to.screen-selection-mode=^{slow} +screenselection
screen-selection-mode.to.normal-mode=+screenselection | +esc | +backspace | +hintscreenselectionkey
screen-selection-mode.break-combo-preparation=+hintscreenselectionkey
screen-selection-mode.to.idle-mode=+exit
screen-selection-mode.hint.type=grid
screen-selection-mode.hint.grid-area=all-screens
screen-selection-mode.hint.grid-max-row-count=1
screen-selection-mode.hint.grid-max-column-count=1
screen-selection-mode.hint.selection-keys=hintscreenselectionkey
screen-selection-mode.hint.font-size=120

# UI hints are enabled by pressing f while holding leftalt.
normal-mode.to.ui-hint-mode=^{slow} +leftalt +hint | _{leftalt} ^{slow} +hint
# Esc and backspace return to the mode UI hints were opened from, as does a scan that finds nothing.
ui-hint-mode.to.previous-mode-from-history-stack=+esc | +backspace | _{ishintmeshempty}
ui-hint-mode.to.normal-mode=+hint1key
ui-hint-mode.break-combo-preparation=+hint1key
ui-hint-mode=_indicator-mode
ui-hint-mode.hint.type=ui-accessibility
ui-hint-mode.hint.ui-area=active-window
ui-hint-mode.hint.selection-keys=hint1key
ui-hint-mode.hint.select=+hint1key
ui-hint-mode.hint.undo=backspace
ui-hint-mode.hint.font-size=10
ui-hint-mode.hint.font-weight=bold
ui-hint-mode.hint.font-color=#FFFFFF
ui-hint-mode.hint.selected-font-color=#CCCCCC
ui-hint-mode.hint.font-shadow-opacity=0
ui-hint-mode.hint.box-color=across-area per-pixel center-to-edge #F97316 #EAB308 #84CC16 #22C55E #14B8A6 #06B6D4 #3B82F6
ui-hint-mode.hint.box-opacity=1
ui-hint-mode.hint.cell-horizontal-padding=8
ui-hint-mode.hint.cell-vertical-padding=0
ui-hint-mode.hint.box-border-opacity=1
ui-hint-mode.hint.box-border-radius=3
ui-hint-mode.hint.background-opacity=0.2

# Recursive hints are enabled with r. Each key narrows the grid to that ninth of it,
# and the pointer follows the grid's center:
#     u  i  o
#     j  k  l
#     m  ,  .
# Backspace goes up a level, space restarts at the full screen, esc stops, q or p turns off.
normal-mode.to.recursive-hint1-mode=^{slow} +recursivehint
_recursive-hint-mode=_indicator-mode
_recursive-hint-mode.press=normal-mode.press
_recursive-hint-mode.release=normal-mode.release
_recursive-hint-mode.toggle=normal-mode.toggle
# Only ö clicks: . is a grid key here, not click-then-turn-off.
_recursive-hint-mode.press.left=_{none | leftctrl} +leftbutton
_recursive-hint-mode.hint.type=grid
_recursive-hint-mode.hint.grid-area=last-selected-hint-cell
_recursive-hint-mode.hint.grid-cell-sizing=fit
_recursive-hint-mode.hint.grid-max-row-count=3
_recursive-hint-mode.hint.grid-max-column-count=3
_recursive-hint-mode.hint.selection-keys=recursivehintkey
_recursive-hint-mode.hint.select=+recursivehintkey
_recursive-hint-mode.hint.mouse-movement=mouse-follows-hint-grid-center
# Released, each cell shows a dot instead of its key preview and the region gets a plus.
virtual-key.showrecursivehintkeys=pressed
_recursive-hint-mode.hint.transition-animation-duration-millis=200
_recursive-hint-mode.hint.fade-animation-duration-millis=100
# Same face as the f hints, so the labels read the same at every level.
_recursive-hint-mode.hint.font-name=Jetbrains Mono
_recursive-hint-mode.hint.font-vertical-alignment=middle
_recursive-hint-mode.hint.font-color=#FFFFFF
_recursive-hint-mode.hint.selected-font-color=#FFFFFF
_recursive-hint-mode.hint.font-opacity=1 | ^{showrecursivehintkeys} -> 0
_recursive-hint-mode.hint.font-shadow-opacity=1
_recursive-hint-mode.hint.font-shadow-blur-radius=10
_recursive-hint-mode.hint.box-color=#000000
_recursive-hint-mode.hint.box-opacity=0.2
_recursive-hint-mode.hint.box-border-color=#FFFFFF
_recursive-hint-mode.hint.box-border-thickness=1
_recursive-hint-mode.hint.box-border-opacity=0.4
# Each cell previews the next level's 3x3 keys.
_recursive-hint-mode.hint.subdecoration-max-row-count=3
_recursive-hint-mode.hint.subdecoration-max-column-count=3
_recursive-hint-mode.hint.subdecoration-label-keys=recursivehintkey
# Previews use the labels' face and shadow, at the size the label has one level down,
# dimmed the way grid hints dim typed letters.
_recursive-hint-mode.hint.subdecoration-font-name=Jetbrains Mono
_recursive-hint-mode.hint.subdecoration-font-color=#FFFFFF
_recursive-hint-mode.hint.subdecoration-font-opacity=0.35
_recursive-hint-mode.hint.subdecoration-font-shadow-opacity=1
_recursive-hint-mode.hint.subdecoration-font-shadow-blur-radius=2
_recursive-hint-mode.hint.subdecoration-box-border-opacity=0
_recursive-hint-mode.hint.subdecoration-label-override=^{showrecursivehintkeys} -> .
_recursive-hint-mode.hint.subdecoration-font-vertical-alignment=middle
_recursive-hint-mode.hint.decoration-max-row-count=1
_recursive-hint-mode.hint.decoration-max-column-count=1
_recursive-hint-mode.hint.decoration-label-override=plus
_recursive-hint-mode.hint.decoration-font-name=Segoe UI
_recursive-hint-mode.hint.decoration-font-weight=thin
_recursive-hint-mode.hint.decoration-font-color=#FFFFFF
_recursive-hint-mode.hint.decoration-font-opacity=0 | ^{showrecursivehintkeys} -> 1
_recursive-hint-mode.hint.decoration-font-shadow-opacity=1
_recursive-hint-mode.hint.decoration-font-vertical-alignment=middle
# Keep the last grid key from also firing in the next mode, e.g. . as click-then-turn-off.
_recursive-hint-mode.break-combo-preparation=+recursivehintkey
_recursive-hint-mode.to.recursive-hint1-mode=+space
_recursive-hint-mode.to.normal-mode=+esc
_recursive-hint-mode.to.idle-mode=+q | +p

# One mode per level. Level 1 covers the active screen; backspace there leaves.
recursive-hint1-mode=_recursive-hint-mode
recursive-hint1-mode.hint.grid-area=active-screen
recursive-hint1-mode.hint.grid-area-center=screen-center
recursive-hint1-mode.hint.font-size=60
recursive-hint1-mode.hint.font-color=#FFD93D
recursive-hint1-mode.hint.subdecoration-font-size=20 | ^{showrecursivehintkeys} -> 40
recursive-hint1-mode.hint.decoration-font-size=60
recursive-hint1-mode.to.recursive-hint2-mode=+recursivehintkey
recursive-hint1-mode.to.normal-mode=+esc | +backspace

recursive-hint2-mode=_recursive-hint-mode
recursive-hint2-mode.hint.font-size=20
recursive-hint2-mode.hint.font-color=#FFD93D
recursive-hint2-mode.hint.font-shadow-blur-radius=3
recursive-hint2-mode.hint.subdecoration-font-size=14
recursive-hint2-mode.hint.decoration-font-size=20
recursive-hint2-mode.to.recursive-hint3-mode=+recursivehintkey
recursive-hint2-mode.to.recursive-hint1-mode=+backspace | +space

recursive-hint3-mode=_recursive-hint-mode
recursive-hint3-mode.hint.font-size=14
recursive-hint3-mode.hint.font-shadow-blur-radius=2
recursive-hint3-mode.hint.subdecoration-font-opacity=0
recursive-hint3-mode.hint.decoration-font-size=10
recursive-hint3-mode.to.recursive-hint4-mode=+recursivehintkey
recursive-hint3-mode.to.recursive-hint2-mode=+backspace

recursive-hint4-mode=_recursive-hint-mode
recursive-hint4-mode.hint.font-size=11
recursive-hint4-mode.hint.font-shadow-blur-radius=2
recursive-hint4-mode.hint.subdecoration-font-opacity=0
recursive-hint4-mode.hint.decoration-font-size=5
recursive-hint4-mode.to.recursive-hint5-mode=+recursivehintkey
recursive-hint4-mode.to.recursive-hint3-mode=+backspace

# The last level: a grid key here finishes, like esc. Its cells are a few pixels wide,
# too small for labels, so the keys pick the same ninths without them.
recursive-hint5-mode=_recursive-hint-mode
recursive-hint5-mode.hint.font-opacity=0
recursive-hint5-mode.hint.subdecoration-font-opacity=0
recursive-hint5-mode.hint.decoration-font-size=4
recursive-hint5-mode.to.recursive-hint4-mode=+backspace
recursive-hint5-mode.to.normal-mode=+esc | +recursivehintkey

# Remappings.
normal-mode.remapping.navigateback=^{slow} +navigateback -> +leftalt +leftarrow -leftarrow -leftalt
normal-mode.remapping.navigateforward=^{slow} +navigateforward -> +leftalt +rightarrow -rightarrow -leftalt

# After Alt+Tab, center the pointer on the window it switched to, then return to the
# previous mode. Works with mousemaster on or off; the tab press still reaches Windows.
idle-mode.to.begin-alt-tab-mode=_{leftalt} #tab
normal-mode.to.begin-alt-tab-mode=_{leftalt} #tab
# The Alt+Tab switcher is Explorer.EXE. Wait for leftalt to be released, then for
# the switcher to lose focus.
begin-alt-tab-mode.to.end-alt-tab-mode=-leftalt
end-alt-tab-mode.to.center-on-active-window-mode=^{Explorer.EXE}
# If Explorer.EXE still has focus 200 ms after the release, go back without moving.
end-alt-tab-mode.to.previous-mode-from-history-stack=#{*}-200
center-on-active-window-mode.grid.area=active-window
center-on-active-window-mode.grid.synchronization=mouse-follows-grid-center
center-on-active-window-mode.to.previous-mode-from-history-stack=wait-0
